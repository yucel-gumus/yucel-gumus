<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Yücel Gümüş — Full Stack AI Engineer, Multi-Agent Systems, 3D and Spatial Intelligence">
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F9F5"/>
      <stop offset="55%" stop-color="#EDF3EE"/>
      <stop offset="100%" stop-color="#DBE6DD"/>
    </linearGradient>
    <linearGradient id="top-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC7D55"/>
      <stop offset="50%" stop-color="#F2A488"/>
      <stop offset="100%" stop-color="#AB421C"/>
    </linearGradient>
    <radialGradient id="halo-glow-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC7D55" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#F2A488" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#EDF3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="eng-grid-light" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BCC7D2" stroke-width="0.8" stroke-opacity="0.55"/>
    </pattern>
    <clipPath id="card-clip-light">
      <rect x="2" y="2" width="1196" height="316" rx="18"/>
    </clipPath>
    <style>
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes floatGlow {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.6; }
      }
      .live-dot { animation: pulse 2.4s ease-in-out infinite; }
      .node-a { animation: floatGlow 3.6s ease-in-out infinite; }
      .node-b { animation: floatGlow 4.2s ease-in-out 1.2s infinite; }
    </style>
  </defs>

  <g clip-path="url(#card-clip-light)">
    <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bg-grad-light)"/>
    <rect x="2" y="2" width="1196" height="316" fill="url(#eng-grid-light)"/>
    <ellipse cx="1002" cy="160" rx="185" ry="155" fill="url(#halo-glow-light)"/>
    <rect x="2" y="2" width="1196" height="4" fill="url(#top-accent-light)"/>
  </g>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="none" stroke="#BCC7D2" stroke-width="1.5"/>

  <!-- Left Zone: Identity, Title & Production Footprint -->
  <g>
    <circle cx="63" cy="50" r="9" fill="#EC7D55" fill-opacity="0.2" class="live-dot"/>
    <circle cx="63" cy="50" r="4.5" fill="#EC7D55" class="live-dot"/>
    <text x="82" y="54" fill="#3E5164" font-size="12" font-weight="600" letter-spacing="2.2" class="mono">PRODUCTION AI &amp; SPATIAL SYSTEMS · ISTANBUL</text>

    <text x="56" y="114" fill="#253341" font-size="46" font-weight="800" letter-spacing="-1" class="sans">Yücel Gümüş</text>
    <text x="56" y="152" fill="#AB421C" font-size="18" font-weight="600" class="sans">Full Stack AI Engineer · Multi-Agent Systems · 3D &amp; Spatial Intelligence</text>

    <text x="56" y="188" fill="#253341" font-size="14" class="sans">Cloud Run mikroservisleri, çoklu etmenli AI ağ geçitleri ve gerçek zamanlı Three.js / CesiumJS</text>
    <text x="56" y="212" fill="#3E5164" font-size="14" class="sans">deneyimleriyle uçtan uca üretim yazılımları geliştiriyorum.</text>

    <!-- Metric Pills -->
    <g transform="translate(56, 240)">
      <rect x="0" y="0" width="174" height="34" rx="17" fill="#DCE3EA" stroke="#BCC7D2" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="4" fill="#EC7D55"/>
      <text x="30" y="21.5" fill="#253341" font-size="12.5" font-weight="600" class="sans">20+ Canlı Uygulama</text>

      <rect x="186" y="0" width="174" height="34" rx="17" fill="#DCE3EA" stroke="#BCC7D2" stroke-width="1.2"/>
      <circle cx="204" cy="17" r="4" fill="#AB421C"/>
      <text x="216" y="21.5" fill="#253341" font-size="12.5" font-weight="600" class="sans">7 Cloud Run Servisi</text>

      <rect x="372" y="0" width="170" height="34" rx="17" fill="#DCE3EA" stroke="#BCC7D2" stroke-width="1.2"/>
      <circle cx="390" cy="17" r="4" fill="#F2A488"/>
      <text x="402" y="21.5" fill="#253341" font-size="12.5" font-weight="600" class="sans">Multi-Agent &amp; RAG</text>

      <rect x="554" y="0" width="156" height="34" rx="17" fill="#DCE3EA" stroke="#BCC7D2" stroke-width="1.2"/>
      <circle cx="572" cy="17" r="4" fill="#3E5164"/>
      <text x="584" y="21.5" fill="#253341" font-size="12.5" font-weight="600" class="sans">3B WebGL &amp; CBS</text>
    </g>
  </g>

  <!-- Vertical Separator -->
  <line x1="812" y1="42" x2="812" y2="278" stroke="#BCC7D2" stroke-width="1.2" stroke-dasharray="4 6"/>

  <!-- Right Zone: Spatial & Multi-Agent Constellation -->
  <g transform="translate(1002, 160)">
    <!-- Coordinate axes -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#BCC7D2" stroke-width="1"/>
    <line x1="0" y1="-132" x2="0" y2="132" stroke="#BCC7D2" stroke-width="1"/>

    <!-- Concentric radar / orbital rings -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#3E5164" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="5 5"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="#BCC7D2" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#EC7D55" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="3 4"/>

    <!-- Spokes from inner core to 6 orbital nodes -->
    <line x1="0" y1="-28" x2="0" y2="-92" stroke="#EC7D55" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="24" y1="-14" x2="76" y2="-44" stroke="#AB421C" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="24" y1="14" x2="76" y2="44" stroke="#3E5164" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="0" y1="28" x2="0" y2="92" stroke="#EC7D55" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="-24" y1="14" x2="-76" y2="44" stroke="#3E5164" stroke-opacity="0.5" stroke-width="1.2"/>
    <line x1="-24" y1="-14" x2="-76" y2="-44" stroke="#AB421C" stroke-opacity="0.5" stroke-width="1.2"/>

    <!-- Isometric 3D Core -->
    <polygon points="0,-28 24,-14 0,0 -24,-14" fill="#F2A488" fill-opacity="0.35" stroke="#EC7D55" stroke-width="1.4"/>
    <polygon points="-24,-14 0,0 0,28 -24,14" fill="#DCE3EA" fill-opacity="0.7" stroke="#3E5164" stroke-width="1.4"/>
    <polygon points="24,-14 0,0 0,28 24,14" fill="#EC7D55" fill-opacity="0.28" stroke="#AB421C" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="3.5" fill="#253341"/>

    <!-- 6 Orbital Capability Pills (r = 104) -->
    <g transform="translate(0, -104)" class="node-a">
      <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#F5F9F5" stroke="#EC7D55" stroke-width="1.3"/>
      <text x="0" y="4" text-anchor="middle" fill="#253341" font-size="11" font-weight="700" class="mono">ADK</text>
    </g>
    <g transform="translate(90, -52)" class="node-b">
      <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#F5F9F5" stroke="#AB421C" stroke-width="1.3"/>
      <text x="0" y="4" text-anchor="middle" fill="#AB421C" font-size="11" font-weight="700" class="mono">RAG</text>
    </g>
    <g transform="translate(90, 52)" class="node-a">
      <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#F5F9F5" stroke="#3E5164" stroke-width="1.3"/>
      <text x="0" y="4" text-anchor="middle" fill="#253341" font-size="11" font-weight="700" class="mono">MCP</text>
    </g>
    <g transform="translate(0, 104)" class="node-b">
      <rect x="-23" y="-12" width="46" height="24" rx="12" fill="#F5F9F5" stroke="#EC7D55" stroke-width="1.3"/>
      <text x="0" y="4" text-anchor="middle" fill="#AB421C" font-size="11" font-weight="700" class="mono">3D</text>
    </g>
    <g transform="translate(-90, 52)" class="node-a">
      <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#F5F9F5" stroke="#3E5164" stroke-width="1.3"/>
      <text x="0" y="4" text-anchor="middle" fill="#253341" font-size="11" font-weight="700" class="mono">GIS</text>
    </g>
    <g transform="translate(-90, -52)" class="node-b">
      <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#F5F9F5" stroke="#AB421C" stroke-width="1.3"/>
      <text x="0" y="4" text-anchor="middle" fill="#AB421C" font-size="11" font-weight="700" class="mono">LLM</text>
    </g>
  </g>
</svg>
